<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm Chokchai Login</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./assets/firebase-config.js"></script>
    <script src="./assets/common.js"></script>
    <script src="./assets/firebase-auth.js"></script>
    <style>
      .auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px}
      .auth-card{width:min(980px,100%);display:grid;grid-template-columns:1.1fr .9fr;gap:18px;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:24px}
      .hero{padding:12px}
      .hero-badge{display:inline-flex;padding:8px 12px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:800;font-size:13px}
      .hero h1{margin:14px 0 10px;font-size:34px;line-height:1.15}
      .hero p{margin:0;color:var(--muted);line-height:1.7}
      .login-box{background:#f8fafc;border:1px solid var(--line);border-radius:24px;padding:22px}
      .login-grid{display:grid;gap:12px}
      .helper-box{margin-top:16px;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:13px;color:#475569;line-height:1.6}
      .error{padding:12px 14px;border-radius:14px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:14px}
      .success{padding:12px 14px;border-radius:14px;background:#ecfdf3;border:1px solid #a7f3d0;color:#047857;font-size:14px}
      .small-link{font-size:13px;color:var(--muted)}
      @media (max-width: 900px){.auth-card{grid-template-columns:1fr}.hero h1{font-size:28px}}
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="text/x-template" id="login-template">
      <div class="auth-shell">
        <div class="auth-card">
          <div class="hero">
            <span class="hero-badge">Firebase Login • Firestore role</span>
            <h1>Farm Chokchai Check-in</h1>
            <p>ล็อกอินด้วย Firebase Authentication แล้วอ่าน role จาก Firestore collection <b>users</b> โดยดูจาก doc id = uid หรือ email ที่ตรงกับผู้ใช้</p>
            <div class="helper-box">
              <div><b>masteradmin</b> = หลังล็อกอินไปหน้า Users เพื่อจัดการ role</div>
              <div><b>admin</b> = หลังล็อกอินไปหน้า QR Code</div>
              <div><b>user</b> = ไปหน้าเช็กอินของผู้ใช้</div>
              <div style="margin-top:8px;color:#64748b">ตัวอย่าง doc ใน Firestore ที่มี <b>active</b>, <b>email</b>, <b>role</b> จะถูกอ่านอัตโนมัติ</div>
            </div>
          </div>

          <div class="login-box">
            <h2 style="margin:0 0 8px;">เข้าสู่ระบบ</h2>
            <p class="muted" style="margin:0 0 16px;">ใช้ email/password จาก Firebase Authentication</p>

            <div v-if="state==='error'" class="error" style="margin-bottom:12px">{{ message }}</div>
            <div v-if="state==='success'" class="success" style="margin-bottom:12px">{{ message }}</div>
            <div v-else class="helper-box" style="margin-bottom:12px">{{ message }}</div>

            <div class="login-grid">
              <div class="field">
                <label>Email</label>
                <input v-model="email" type="email" placeholder="name@example.com" autocomplete="username" />
              </div>
              <div class="field">
                <label>Password</label>
                <input v-model="password" type="password" placeholder="••••••••" autocomplete="current-password" />
              </div>
              <button class="btn primary" :disabled="loading" @click="login">
                {{ loading ? 'กำลังเข้าสู่ระบบ...' : 'Login' }}
              </button>
            </div>

            <div class="helper-box">
              ถ้าสร้างผู้ใช้ไว้แล้ว แต่ยังไม่ขึ้น role ให้ตรวจว่า doc ใน collection <b>users</b> ใช้ uid เดียวกับ Firebase Auth หรือมี email ตรงกัน และเปิดอ่าน Firestore ได้
            </div>
            <div class="small-link" style="margin-top:10px;">role ปัจจุบัน: <b>{{ role || '-' }}</b></div>
          </div>
        </div>
      </div>
    </script>

    <script src="./assets/page-scripts/login.js"></script>
  </body>
</html>
