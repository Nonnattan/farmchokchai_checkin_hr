<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>LINE Check-in</title>

    <link rel="stylesheet" href="../assets/styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      body {
        background-color: #f1f5f9;
        font-family: "Sarabun", sans-serif;
      }

      .user-shell {
        max-width: 480px;
        margin: 0 auto;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .user-card {
        background: #fff;
        border-radius: 24px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        padding: 30px 20px;
        text-align: center;
      }

      .user-logo {
        width: 70px;
        height: 70px;
        border-radius: 20px;
        background: #06c755;
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 16px;
      }

      .user-title {
        margin: 0;
        font-size: 26px;
        color: #0f172a;
        font-weight: bold;
      }

      .profile-simple {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .profile-simple img,
      .profile-avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #e2e8f0;
        background: #e2e8f0;
      }

      .profile-simple p {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: #334155;
      }

      .status-box {
        margin-top: 24px;
        padding: 20px;
        border-radius: 16px;
        background: #f8fafc;
        border: 2px solid #e2e8f0;
        min-height: 112px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .status-box.loading {
        border-color: #cbd5e1;
        background: #f8fafc;
        color: #475569;
      }
      .status-box.success {
        border-color: #10b981;
        background: #ecfdf5;
        color: #047857;
      }
      .status-box.error {
        border-color: #ef4444;
        background: #fef2f2;
        color: #b91c1c;
      }

      .status-main {
        font-size: 22px;
        font-weight: bold;
        margin: 0;
      }

      .status-sub {
        font-size: 15px;
        margin: 8px 0 0 0;
        opacity: 0.9;
        line-height: 1.5;
      }

      .btn-massive {
        appearance: none;
        width: 100%;
        margin-top: 30px;
        padding: 18px 20px;
        border: none;
        border-radius: 16px;
        background: #06c755;
        color: white;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(6, 199, 85, 0.2);
        transition:
          transform 0.1s,
          opacity 0.2s;
      }

      .btn-massive:active {
        transform: scale(0.97);
      }

      .btn-massive:disabled {
        background: #94a3b8;
        box-shadow: none;
        cursor: not-allowed;
        opacity: 0.85;
      }

      .hint {
        margin-top: 14px;
        font-size: 13px;
        color: #64748b;
        line-height: 1.5;
      }

      .mini-spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: -2px;
        margin-right: 8px;
      }

      .map-section {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid #e2e8f0;
        text-align: left;
      }

      .map-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }

      .map-head h2 {
        margin: 0;
        font-size: 16px;
        color: #0f172a;
      }

      .map-head p {
        margin: 4px 0 0;
        font-size: 12px;
        color: #64748b;
        line-height: 1.4;
      }

      .map-badge {
        font-size: 12px;
        padding: 7px 10px;
        border-radius: 999px;
        background: #eff6ff;
        color: #1d4ed8;
        white-space: nowrap;
      }

      .map-wrap {
        height: 280px;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid #e2e8f0;
        background: #fff;
      }

      .map {
        width: 100%;
        height: 100%;
      }

      .map-foot {
        margin-top: 10px;
        font-size: 12px;
        color: #64748b;
        line-height: 1.5;
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .small-pill {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        background: #f8fafc;
        color: #334155;
        font-size: 12px;
        border: 1px solid #e2e8f0;
      }

      .small-pill.good {
        background: #ecfdf5;
        border-color: #a7f3d0;
        color: #047857;
      }

      .small-pill.bad {
        background: #fef2f2;
        border-color: #fecaca;
        color: #b91c1c;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>    <script src="../assets/common.js"></script>

    <script src="../assets/page-scripts/user-checkin.js"></script>
  </body>
</html>
