<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Check-in</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div id="app"></div>
  <script src="./assets/common.js"></script>
  <script>
  const { createApp, computed, onMounted, ref, nextTick } = Vue;
  const common = window.CheckinCommon;
  createApp({
  setup() {
    const config = ref({ ...common.DEFAULT_CONFIG });
    const loading = ref(false);
    const permissionState = ref("unknown");
    const result = ref(null);
    const message = ref("");
    const currentLocation = ref(null);
    const query = new URLSearchParams(location.search);
    const session = query.get("session") || "-";
    const site = computed(() => query.get("site") || config.value.siteName || "-");

    const boundary = computed(() => common.buildBoundary(config.value));
    const insideNow = computed(() => result.value === "inside");
    const locationRequired = computed(() => permissionState.value !== "granted");

    const mapEl = ref(null);
    let map = null;
    let boundaryRect = null;
    let currentMarker = null;
    let centerMarker = null;

    async function loadConfig() {
      config.value = await common.getConfig();
    }

    function refreshMap() {
      if (!map || !boundary.value) return;
      const b = boundary.value;
      const bounds = [[b.minLat, b.minLng], [b.maxLat, b.maxLng]];
      boundaryRect?.setBounds(bounds);
      centerMarker?.setLatLng([b.centerLat, b.centerLng]);
      map.fitBounds(bounds, { padding: [30, 30] });
      if (currentLocation.value) {
        const { lat, lng } = currentLocation.value;
        if (!currentMarker) currentMarker = L.circleMarker([lat, lng], { radius: 8, color: '#dc2626', fillColor: '#ef4444', fillOpacity: 1, weight: 2 }).addTo(map).bindPopup("ตำแหน่งปัจจุบัน");
        else currentMarker.setLatLng([lat, lng]);
      }
    }

    function initMap() {
      if (map || !mapEl.value || !window.L) return;
      const b = boundary.value;
      map = L.map(mapEl.value, { zoomControl: true });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);

      boundaryRect = L.rectangle([[b.minLat, b.minLng], [b.maxLat, b.maxLng]], {
        color: '#16a34a',
        weight: 2,
        fillColor: '#16a34a',
        fillOpacity: 0.12
      }).addTo(map);

      centerMarker = L.circleMarker([b.centerLat, b.centerLng], { radius: 8, color: '#f59e0b', fillColor: '#f59e0b', fillOpacity: 1, weight: 2 }).addTo(map).bindPopup('จุดศูนย์กลางพื้นที่ที่อนุญาต');
      map.fitBounds([[b.minLat, b.minLng], [b.maxLat, b.maxLng]], { padding: [30, 30] });
    }

    function requestLocation() {
      loading.value = true;
      message.value = "กำลังขอตำแหน่งจากเครื่อง...";
      if (!navigator.geolocation) {
        loading.value = false;
        permissionState.value = "unsupported";
        message.value = "เบราว์เซอร์นี้ไม่รองรับ geolocation";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          loading.value = false;
          permissionState.value = "granted";
          currentLocation.value = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
          const inside = common.isInsideBoundary(pos.coords.latitude, pos.coords.longitude, boundary.value);
          result.value = inside ? "inside" : "outside";
          message.value = inside ? "ผ่านเงื่อนไข สามารถเช็กอินได้" : "อยู่นอกพื้นที่ที่กำหนด";
          if (map) {
            if (!currentMarker) currentMarker = L.circleMarker([pos.coords.latitude, pos.coords.longitude], { radius: 8, color: '#dc2626', fillColor: '#ef4444', fillOpacity: 1, weight: 2 }).addTo(map).bindPopup('ตำแหน่งปัจจุบัน');
            else currentMarker.setLatLng([pos.coords.latitude, pos.coords.longitude]);
          }
        },
        (err) => {
          loading.value = false;
          permissionState.value = "denied";
          currentLocation.value = null;
          result.value = null;
          message.value = err.code === err.PERMISSION_DENIED ? "ต้องเปิดตำแหน่งก่อนจึงจะเช็กอินได้" : "อ่านตำแหน่งไม่สำเร็จ";
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    }

    function doCheckIn() {
      if (!currentLocation.value || result.value !== "inside") return;
      common.addLog({ site: site.value, session, status: "checked_in", lat: currentLocation.value.lat, lng: currentLocation.value.lng, accuracy: currentLocation.value.accuracy, boundary: boundary.value });
      location.href = "./success.html";
    }

    onMounted(async () => {
      await loadConfig();
      await nextTick();
      initMap();
      refreshMap();
      requestLocation();
    });

    return { config, loading, permissionState, result, message, currentLocation, boundary, session, site, insideNow, locationRequired, requestLocation, doCheckIn, common, mapEl };
  },
  template: `
    <div class="container">
      <div class="topbar">
        <div class="brand">
          <div class="brand-badge">AU</div>
          <div>
            <h1>Admin / Location Check</h1>
            <p>หน้านี้เก็บไว้สำหรับแอดมินตรวจดูสถานะและพื้นที่อนุญาต</p>
          </div>
        </div>
        <div class="nav">
          <a href="./index.html">QR Login</a>
          <a href="./user/checkin.html">User</a>
          <a class="active" href="./auth.html">Admin</a>
          <a href="./settings.html">Settings</a>
          <a href="./logs.html">Logs</a>
        </div>
      </div>

      <div class="grid">
        <section class="card span-6 stack">
          <div>
            <h2>ตรวจสอบตำแหน่ง</h2>
            <p class="muted">ให้สิทธิ์ตำแหน่งเพื่อดูว่าตอนนี้อยู่ในกรอบเช็กอินหรือไม่</p>
          </div>

          <div v-if="locationRequired" class="card" style="padding:18px;background:#fff7ed;border:1px solid #fed7aa">
            <b>ต้องอนุญาตตำแหน่งก่อน</b>
            <p class="muted" style="margin:8px 0 0">กดปุ่มด้านล่างแล้วเบราว์เซอร์จะถาม permission เอง</p>
          </div>

          <div class="actions">
            <button class="btn primary" @click="requestLocation" :disabled="loading">{{ loading ? 'กำลังตรวจ...' : 'ตรวจตำแหน่ง' }}</button>
            <button class="btn success" @click="doCheckIn" :disabled="loading || !insideNow">เช็กอิน</button>
          </div>

          <div class="status-banner" :class="result || 'idle'">
            <strong>{{ message || 'พร้อมใช้งาน' }}</strong>
            <div class="muted" style="margin-top:6px">{{ site }} • Session: {{ session }}</div>
          </div>

          <div class="grid">
            <div class="span-6 field"><label>Current Lat</label><div class="code">{{ currentLocation ? common.formatNumber(currentLocation.lat) : '-' }}</div></div>
            <div class="span-6 field"><label>Current Lng</label><div class="code">{{ currentLocation ? common.formatNumber(currentLocation.lng) : '-' }}</div></div>
          </div>

          <div class="card" style="padding:16px;background:#fafbff;border-style:dashed">
            <strong>โน้ต</strong>
            <p class="muted" style="margin:8px 0 0">{{ config.note }}</p>
          </div>
        </section>

        <aside class="card span-6 stack">
          <h2>Map</h2>
          <div class="map-shell">
            <div class="map-hint">
              <div class="map-label">พื้นที่สีเขียว = เช็กอินได้</div>
              <div class="pill success">Boundary</div>
            </div>
            <div class="map-wrap"><div ref="mapEl" class="map"></div></div>
          </div>
        </aside>

        <section class="card full">
          <div class="grid">
            <div class="span-3 field"><label>Center Latitude</label><div class="code">{{ common.formatNumber(config.centerLat) }}</div></div>
            <div class="span-3 field"><label>Center Longitude</label><div class="code">{{ common.formatNumber(config.centerLng) }}</div></div>
            <div class="span-3 field"><label>North</label><div class="code">{{ common.formatNumber(boundary.maxLat) }}</div></div>
            <div class="span-3 field"><label>South</label><div class="code">{{ common.formatNumber(boundary.minLat) }}</div></div>
            <div class="span-3 field"><label>East</label><div class="code">{{ common.formatNumber(boundary.maxLng) }}</div></div>
            <div class="span-3 field"><label>West</label><div class="code">{{ common.formatNumber(boundary.minLng) }}</div></div>
          </div>
        </section>
      </div>
    </div>
  `,
}).mount("#app");

  </script>
</body>
</html>
