<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./assets/firebase-config.js"></script>
    <script src="./assets/firebase-auth.js"></script>
    <style>
      .page-subtitle{margin:4px 0 0;color:#667085}
      .admin-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}
      .toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
      .status-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:14px;background:#f8fafc;border:1px solid var(--line)}
      .status-bar.success{background:#ecfdf3;border-color:#a7f3d0}
      .status-bar.loading{background:#eff6ff;border-color:#bfdbfe}
      .status-bar.error{background:#fef2f2;border-color:#fecaca}
      .status-title{margin:0;font-weight:700;color:#0f172a}
      .status-sub{margin:4px 0 0;font-size:13px;color:#475569;line-height:1.5}
      .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin 0.8s linear infinite;vertical-align:-2px;margin-right:8px}
      .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fff}
      .click-row{cursor:pointer}
      .click-row:hover{background:#f8fafc}
      .pill-sm{display:inline-flex;padding:6px 10px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:800}
      .map-wrap{height:520px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#eef2ff}
      .map{width:100%;height:100%}
      .mini-note{font-size:13px;color:#64748b;line-height:1.5}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media (max-width: 1100px){.admin-grid{grid-template-columns:1fr}.map-wrap{height:360px}}
    </style>
  </head>
  <body>
    <div id="app"></div>    <script src="./assets/common.js"></script>
    <script src="./assets/components/nav-tabs.js"></script>

    <script src="./assets/page-scripts/admin.js"></script>
  </body>
</html>
