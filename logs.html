<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Logs</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./assets/firebase-config.js"></script>
    <script src="./assets/firebase-auth.js"></script>
    <style>
      .page-subtitle {
        margin: 4px 0 0;
        color: #667085;
      }
      .nav-logout-btn {
        background: #ef4444;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-left: auto;
      }
      .nav-logout-btn:hover {
        background: #dc2626;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
      }
      .edit-name-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .edit-name-input {
        flex: 1;
        border: 1px solid #dbe3ef;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
        outline: none;
      }
      .field-cell {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
      }
      .field-cell .field-value {
        font-weight: 700;
        color: #172033;
      }
      .field-cell .field-value.empty {
        font-weight: 400;
        color: #999;
      }
      .field-edit-row {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        min-width: 190px;
      }
      .field-edit-input {
        flex: 1;
        min-width: 100px;
        border: 1px solid #dbe3ef;
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 13px;
        outline: none;
      }
      .field-edit-input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }
      .icon-btn {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        border: 1px solid #dbe3ef;
        background: #f8fafc;
        color: #475569;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        transition: all 0.2s ease;
      }
      .icon-btn:hover:not(:disabled) {
        background: #eef4ff;
        border-color: #2563eb;
        color: #2563eb;
      }
      .icon-btn.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      .icon-btn.primary:hover:not(:disabled) {
        background: #1d4ed8;
      }
      .icon-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-small {
        padding: 6px 12px;
        border-radius: 6px;
        border: none;
        font-weight: 700;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.2s ease;
      }
      .btn-small.primary {
        background: #2563eb;
        color: #fff;
      }
      .btn-small.primary:hover:not(:disabled) {
        background: #1d4ed8;
      }
      .btn-small.ghost {
        background: #f1f5f9;
        color: #132238;
        border: 1px solid #dbe3ef;
      }
      .btn-small.ghost:hover:not(:disabled) {
        background: #e2e8f0;
      }
      .btn-small:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .filter-panel {
        display: grid;
        gap: 14px;
      }
      .tab-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .tab-btn {
        border: 1px solid #dbe3ef;
        background: #fff;
        color: #132238;
        border-radius: 999px;
        padding: 10px 14px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .tab-btn.active {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
        box-shadow: 0 10px 18px rgba(37, 99, 235, 0.15);
      }
      .range-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        align-items: end;
      }
      .filter-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }
      .summary-card {
        background: #f8fafc;
        border: 1px solid #e6e9f0;
        border-radius: 18px;
        padding: 14px 16px;
      }
      .summary-label {
        margin: 0;
        font-size: 13px;
        color: #667085;
        font-weight: 700;
      }
      .summary-value {
        margin: 6px 0 0;
        font-size: 22px;
        font-weight: 900;
        color: #172033;
        word-break: break-word;
      }
      .summary-note {
        margin: 4px 0 0;
        font-size: 12px;
        color: #667085;
      }
      .empty-state {
        padding: 28px 18px;
        text-align: center;
        color: #667085;
        line-height: 1.7;
      }
      .table-wrap {
        margin-top: 16px;
      }
      .load-more-shell {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }
      .load-more-sentinel {
        height: 1px;
      }
      .load-more-note {
        text-align: center;
        font-size: 13px;
        color: #667085;
      }
      .email-text {
        font-size: 12px;
        color: #4b5563;
        display: inline-block;
        margin-top: 2px;
        background: #f1f5f9;
        padding: 1px 6px;
        border-radius: 4px;
      }

      .search-filter-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }
      .searchable-field {
        position: relative;
      }
      .dropdown-trigger {
        width: 100%;
        border: 1px solid #dbe3ef;
        background: #fff;
        color: #132238;
        border-radius: 14px;
        padding: 12px 14px;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-weight: 800;
        cursor: pointer;
        text-align: left;
      }
      .dropdown-trigger:hover {
        border-color: #b7c6df;
      }
      .dropdown-caret {
        color: #667085;
        font-size: 14px;
        flex: 0 0 auto;
      }
      .dropdown-panel {
        position: absolute;
        z-index: 20;
        left: 0;
        right: 0;
        margin-top: 8px;
        background: #fff;
        border: 1px solid #dbe3ef;
        border-radius: 16px;
        box-shadow: 0 18px 40px rgba(16, 24, 40, 0.12);
        overflow: hidden;
      }
      .dropdown-search {
        padding: 12px;
        border-bottom: 1px solid #edf1f7;
        background: #f8fafc;
      }
      .dropdown-search input {
        width: 100%;
        border: 1px solid #dbe3ef;
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 14px;
        outline: none;
      }
      .dropdown-list {
        max-height: 280px;
        overflow: auto;
      }
      .dropdown-option {
        width: 100%;
        border: 0;
        background: #fff;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        text-align: left;
        cursor: pointer;
        font-weight: 700;
        color: #132238;
      }
      .dropdown-option:hover {
        background: #f8fafc;
      }
      .dropdown-option.selected {
        background: #eef4ff;
        color: #1d4ed8;
      }
      .dropdown-option small {
        color: #667085;
        font-weight: 700;
      }
      .dropdown-empty {
        padding: 14px;
        text-align: center;
        color: #667085;
        font-size: 13px;
      }
      .filter-chip {
        border: 1px solid #dbe3ef;
        background: #f8fafc;
        border-radius: 14px;
        padding: 12px 14px;
        min-height: 48px;
        display: flex;
        align-items: center;
        font-weight: 800;
        color: #132238;
      }
      @media (max-width: 900px) {
        .summary-grid,
        .range-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>    <script src="./assets/common.js"></script>
    <script src="./assets/components/nav-tabs.js"></script>

    <script src="./assets/page-scripts/logs.js"></script>
  </body>
</html>
