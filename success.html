<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check-in Success</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
      body { background:#f8fafc; margin:0; font-family:sans-serif; color:#0f172a; }
      .container { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px; }
      .card { max-width:460px; width:100%; text-align:center; padding:48px 32px; border:1px solid #e2e8f0; border-radius:20px; background:#fff; box-shadow:0 16px 36px rgba(15,23,42,.06); }
      .icon { width:72px; height:72px; margin:0 auto 24px; background:#ecfdf3; border-radius:50%; display:flex; align-items:center; justify-content:center; }
      .btn { width:100%; display:block; border:1px solid #e2e8f0; padding:12px; border-radius:10px; text-decoration:none; color:#475569; font-weight:700; background:#fff; }
      .btn + .btn { margin-top:10px; }
      .muted { color:#64748b; line-height:1.6; }
      .row { text-align:left; margin:14px 0 24px; }
      .tag { display:inline-flex; padding:8px 12px; border-radius:999px; background:#ecfdf3; color:#047857; font-size:12px; font-weight:800; margin-bottom:14px; }
    </style>
  </head>
  <body>
    <div id="app"></div>    <script src="./assets/common.js"></script>

    <script src="./assets/page-scripts/success.js"></script>
  </body>
</html>
