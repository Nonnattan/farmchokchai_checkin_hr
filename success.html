<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check-in Success</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
      body {
        background: #f8fafc;
        margin: 0;
        font-family: sans-serif;
        color: #0f172a;
      }
      .container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 16px;
      }
      .card {
        max-width: 460px;
        width: 100%;
        text-align: center;
        padding: 48px 32px;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 16px 36px rgba(15, 23, 42, 0.06);
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        background: #ecfdf3;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn {
        width: 100%;
        display: block;
        border: 1px solid #e2e8f0;
        padding: 12px;
        border-radius: 10px;
        text-decoration: none;
        color: #475569;
        font-weight: 700;
        background: #fff;
      }
      .btn + .btn {
        margin-top: 10px;
      }
      .muted {
        color: #64748b;
        line-height: 1.6;
      }
      .row {
        text-align: left;
        margin: 14px 0 24px;
      }
      .tag {
        display: inline-flex;
        padding: 8px 12px;
        border-radius: 999px;
        background: #ecfdf3;
        color: #047857;
        font-size: 12px;
        font-weight: 800;
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="./assets/common.js"></script>
    <script>
      const { createApp, ref, onMounted } = Vue;
      const common = window.CheckinCommon;

      createApp({
        setup() {
          const status = ref("กำลังโหลดข้อมูล...");
          const lastCheckin = ref(null);

          onMounted(() => {
            sessionStorage.removeItem("checkin_flow_running");
            try {
              const raw = localStorage.getItem("last_checkin");
              if (raw) {
                lastCheckin.value = JSON.parse(raw);
              }
              status.value = "เช็กอินสำเร็จ";
            } catch (err) {
              console.error(err);
              status.value = "เช็กอินสำเร็จ";
            }
          });

          return { status, lastCheckin, common };
        },
        template: `
          <div class="container">
            <div class="card">
              <div class="icon">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </div>

              <div class="tag">{{ status }}</div>
              <h1 style="margin:0 0 12px;font-size:22px;font-weight:800;color:#0f172a;">บันทึกข้อมูลเรียบร้อยแล้ว</h1>
              <p class="muted" style="margin:0 0 8px;font-size:14px;">ระบบเช็กอินเสร็จสมบูรณ์แล้ว</p>

              <div v-if="lastCheckin" class="row muted" style="font-size:14px;">
                <div>ชื่อ: {{ lastCheckin.name || '-' }}</div>
                <div v-if="lastCheckin.email">Email: {{ lastCheckin.email }}</div>
                <div>เวลา: {{ lastCheckin.timeText || common.formatDate(lastCheckin.time) }}</div>
              </div>

              <a class="btn" href="./user/checkin.html">เช็กอินอีกครั้ง</a>
            </div>
          </div>
        `,
      }).mount("#app");
    </script>
  </body>
</html>
